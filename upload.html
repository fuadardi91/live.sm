<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplemice Live Event - Upload Foto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 md:p-6 shadow-2xl relative my-auto space-y-4">
        
        <div class="text-center pb-3 border-b border-slate-800">
            <div class="inline-flex items-center gap-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-full font-bold text-xs uppercase tracking-wider mb-2">
                <i class="fa-solid fa-camera-retro"></i> Simplemice Guest App
            </div>
            <h1 id="eventTitleHeading" class="text-xl md:text-2xl font-extrabold font-heading text-white">Capacity Building</h1>
            <p id="eventSubtitleHeading" class="text-xs text-cyan-400 font-semibold uppercase tracking-widest mt-0.5">RS Mata Cicendo</p>
            <p class="text-[11px] text-slate-400 mt-2">Unggah foto momen serumu untuk langsung ditayangkan di layar Videotron!</p>
        </div>

        <form id="uploadForm" onsubmit="event.preventDefault(); submitPhotoFromMobile();" class="space-y-4 text-xs">
            <div>
                <label for="guestNameInput" class="block font-semibold text-slate-300 mb-1">Nama / Inisial Pengirim <span class="text-rose-400">*</span></label>
                <input type="text" id="guestNameInput" required placeholder="Contoh: Budi" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500 text-sm">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Pilih / Ambil Foto <span class="text-rose-400">*</span></label>
                <div id="photoDropZone" onclick="document.getElementById('mobileFileInput').click()" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-2xl p-4 text-center cursor-pointer bg-slate-950/60 transition-all">
                    <input type="file" id="mobileFileInput" accept="image/*" class="hidden" onchange="handleImageSelect(this)">
                    
                    <div id="uploadPlaceholder" class="space-y-1.5 py-2">
                        <div class="w-12 h-12 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-500/30 flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <p class="text-xs text-slate-200 font-bold">Tekan di sini untuk memilih foto</p>
                        <p class="text-[10px] text-slate-400">Format JPG, PNG atau WebP (Kamera / Galeri HP)</p>
                    </div>

                    <div id="uploadPreviewContainer" class="hidden relative">
                        <img id="mobilePreviewImg" src="" alt="Preview Upload" class="max-h-52 rounded-xl mx-auto object-cover border border-slate-700 shadow-lg">
                        <button type="button" onclick="event.stopPropagation(); removeSelectedImage();" class="absolute top-2 right-2 bg-rose-600 hover:bg-rose-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs shadow-md">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <label for="guestWishInput" class="font-semibold text-slate-300 mb-1 block">Pesan</label>
                <textarea id="guestWishInput" rows="2" placeholder="Tulis ucapan selamat atau kesan pesan Anda..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500 resize-none text-xs"></textarea>
            </div>

            <button type="submit" id="mobileSubmitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-rose-500 hover:from-cyan-400 hover:to-rose-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer transition-all text-sm">
                <i class="fa-solid fa-paper-plane"></i> Kirim Ke Videotron
            </button>
        </form>

        <p class="text-[10px] text-center text-slate-500 pt-2 border-t border-slate-800/80">
            Powered by Simplemice Live Event Cloud System
        </p>
    </div>

    <div id="toast" class="fixed bottom-6 inset-x-4 max-w-sm mx-auto transform translate-y-24 opacity-0 transition-all duration-300 z-50 bg-slate-900 border border-slate-700 text-white p-4 rounded-2xl shadow-2xl flex items-center space-x-3 pointer-events-none">
        <div id="toastIcon" class="w-9 h-9 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold shrink-0">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
            <p id="toastTitle" class="text-xs font-bold">Notifikasi</p>
            <p id="toastMsg" class="text-[11px] text-slate-300">Pesan notifikasi.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARSGnFk3WQ7ZPpInl6DtfnGM5MvJSXsVQ",
            authDomain: "live-photo-7a430.firebaseapp.com",
            projectId: "live-photo-7a430",
            storageBucket: "live-photo-7a430.firebasestorage.app",
            messagingSenderId: "923238404835",
            appId: "1:923238404835:web:b6d500e896a8c69a8f6bd6",
            measurementId: "G-QZ6H30GNFG"
        };

        let db = null;
        let isFirebaseActive = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            isFirebaseActive = true;
        } catch (e) {
            console.warn("Gagal terhubung Firebase:", e);
        }

        let uploadedBase64 = null;

        // Image compression helper to prevent Firestore 1MB document limit overflow
        window.compressImageBase64 = function(file, maxWidth = 1000, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = err => reject(err);
                };
                reader.onerror = err => reject(err);
            });
        };

        window.handleImageSelect = async function(input) {
            if (input.files && input.files[0]) {
                try {
                    showToast('Memproses Foto', 'Sedang mengompresi foto...', 'info');
                    uploadedBase64 = await compressImageBase64(input.files[0]);
                    document.getElementById('mobilePreviewImg').src = uploadedBase64;
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('uploadPreviewContainer').classList.remove('hidden');
                } catch (err) {
                    showToast('Gagal Memuat', 'Coba foto lain.', 'error');
                }
            }
        };

        window.removeSelectedImage = function() {
            uploadedBase64 = null;
            document.getElementById('mobileFileInput').value = '';
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('uploadPreviewContainer').classList.add('hidden');
        };

        window.submitPhotoFromMobile = async function() {
            const name = document.getElementById('guestNameInput').value.trim();
            const wish = document.getElementById('guestWishInput').value.trim();

            if (!name) { showToast('Nama Wajib', 'Isi nama Anda.', 'error'); return; }
            if (!uploadedBase64) { showToast('Foto Wajib', 'Pilih foto sebelum dikirim.', 'error'); return; }

            const btn = document.getElementById('mobileSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Mengirim...`;

            const newPhoto = {
                sender: name,
                wish: wish || ' ',
                status: 'approved',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                url: uploadedBase64
            };

            if (isFirebaseActive && db) {
                try {
                    await addDoc(collection(db, "photos"), { 
                        ...newPhoto, 
                        createdAt: serverTimestamp(),
                        timeNum: Date.now()
                    });
                    showToast('Berhasil Terkirim!', 'Fotomu langsung dikirim ke Cloud & Layar Videotron!', 'success');
                } catch (err) {
                    showToast('Gagal Cloud', 'Gagal mengirim ke database Firebase.', 'error');
                }
            } else {
                let photoList = [];
                try {
                    const savedList = localStorage.getItem('simplemice_photos');
                    if (savedList) photoList = JSON.parse(savedList);
                } catch (e) {}
                photoList.unshift({ id: 'photo_' + Date.now(), ...newPhoto });
                if (photoList.length > 15) photoList = photoList.slice(0, 15);
                localStorage.setItem('simplemice_photos', JSON.stringify(photoList));
                window.dispatchEvent(new Event('storage'));
                showToast('Terkirim Lokal', 'Fotomu berhasil tersimpan.', 'success');
            }

            removeSelectedImage();
            document.getElementById('guestNameInput').value = '';
            document.getElementById('guestWishInput').value = '';
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Kirim Ke Videotron`;
        };

        function showToast(title, message, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
        }
    </script>
</body>
</html>
